name: Fork — Build Windows CUDA wheel

# Custom workflow for building the perf/p2-rdna4-port fork into a Windows CUDA wheel.
# Upstream uses self-hosted runners via runs-on.com which aren't available in forks,
# so we build on a GitHub-hosted windows-2022 image with the standard CUDA-toolkit
# action. Targets Ada Lovelace (compute capability 8.9) only to keep the build small.

on:
  push:
    branches:
      - perf/p2-rdna4-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-cuda:
    name: Build XGBoost CUDA wheel on windows-2022
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CUDA Toolkit 13.1
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.1.1'
          method: 'network'
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","curand","curand_dev","thrust","visual_studio_integration"]'

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling packaging wheel

      - name: Configure CMake (Visual Studio 2022, CUDA 13.1, sm_89)
        shell: pwsh
        run: |
          mkdir build
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DUSE_CUDA=ON `
            -DGOOGLE_TEST=OFF `
            -DGPU_COMPUTE_VER=89 `
            -DBUILD_DEPRECATED_CLI=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build libxgboost
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel --target xgboost
          if ($LASTEXITCODE -ne 0) { throw "cmake --build failed" }

      - name: Show built artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse lib | Select-Object FullName, Length
          Get-ChildItem -Recurse build/Release | Where-Object { $_.Name -match "xgboost\.(dll|lib|exp)" } | Select-Object FullName, Length

      - name: Build Python wheel
        shell: pwsh
        run: |
          cd python-package
          pip wheel --no-deps -v . --wheel-dir dist/
          if ($LASTEXITCODE -ne 0) { throw "pip wheel failed" }
          Get-ChildItem dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-windows-cuda-${{ github.sha }}
          path: python-package/dist/*.whl
          retention-days: 30
          if-no-files-found: error
